[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sort-downloads"
version = "1.0.0"
description = "Sort a messy Downloads folder into category, extension and month folders, and recycle exact duplicates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Divyajeet Panda" }]
requires-python = ">=3.9"
dependencies = ["rich>=13", "send2trash>=1.8"]
keywords = ["downloads", "file-organizer", "cli", "duplicates", "rich"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sort-downloads = "sort_downloads:main"

[project.urls]
Homepage = "https://github.com/Divyajeet7978/Sort-Downloads"

[tool.setuptools]
py-modules = ["sort_downloads"]
